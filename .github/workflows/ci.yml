# Pull requests: syntax checks and terraform plan.
# Requires GitHub secret AWS_PLAN_ROLE_ARN and variables TF_STATE_BUCKET, TF_LOCK_TABLE
# after terraform/bootstrap has been applied once by a person.

name: ci

on:
  pull_request:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.9.8

jobs:
  checks:
    name: syntax checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend lint
        working-directory: frontend
        run: |
          npm ci
          npm run lint

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Backend and AI syntax
        run: python -m compileall backend ai-service

      - name: AI service unit tests
        working-directory: ai-service
        run: |
          pip install -r requirements.txt pytest
          python -m pytest -q

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt and validate
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

  plan:
    name: terraform plan
    runs-on: ubuntu-latest
    needs: checks
    # Skipped until terraform/bootstrap has been applied and the repository variables are set.
    if: ${{ vars.TF_STATE_BUCKET != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform plan
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true"
          terraform plan -input=false -no-color

  images:
    name: build images (no push)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg VITE_API_URL=http://api.example.test -t frontend frontend
      - run: docker build -t backend backend
      - run: docker build -t ai-service ai-service
